<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamagonche</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+15&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      background: #f5ac00;
      margin: 0;
      padding: 0;
      font-size: 20px;
      font-family: "Jersey 15", sans-serif;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr;
      grid-template-columns: 1fr 400px;
      height: 100vh;
    }

    #container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #canvas-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    #sidebar {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 100%;
      overflow-y: auto;
    }

    .action {
      background: #ffffff;
      color: #000000;
      margin: 6px;
      padding: 10px;
      text-align: center;
    }
    .action > .time {
      color: #666666;
    }

    .action .pseudo {
      color: #d10000;
    }

    .status-bar {
      grid-column: 1 / -1;
      background: #000000;
      color: #ffffff;
      width: 100%;
      padding: 3px 5px;
    }
    .status-bar > a, .status-bar > a:hover, .status-bar > a:visited {
      color: #ffffff;
      text-wrap: nowrap;
    }
    @media (max-width: 768px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr 1fr;
      }
      #sidebar {
        max-width: 100%;
        overflow-y: visible;
      }
    }
    </style>
  </head>
  <body>
    <div class="status-bar">
      Tamagonche v0.2.0 -
      <a target="_blank" href="https://onche.org/topic/817382/tamagonche">topic</a> -
      <a target="_blank" href="https://github.com/pepe-onche/pepe-onche.github.io/tree/main/tamagonche">source (site)</a> -
      <a target="_blank" href="https://github.com/pepe-onche/onchebot/blob/dev/onchebot/examples/tamagonche.py">source (bot)</a>
    </div>
    <div id="canvas-container">
      <canvas id="canvas"></canvas>
    </div>
    <div id="sidebar">
      <div class="action">HISTORIQUE</div>
      <div id="actions"></div>
    </div>
    <script src="game.js" type="module"></script>
</body>
</html>
